<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LLAMAMIENTO FD Bloque</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .drag-drop {
    border: 2px dashed #9ca3af;
    border-radius: 8px;
    background-color: #f3f4f6;
    padding: 40px;
    text-align: center;
    cursor: pointer;
    transition: background-color 0.2s, border-color 0.2s;
    position: relative;
  }
  .drag-drop.dragover {
    background-color: #e0f2fe;
    border-color: #3b82f6;
  }
  .drag-drop input[type="file"] {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0;
    top: 0;
    left: 0;
    cursor: pointer;
  }
  .country-selected {
    border: 3px solid #3b82f6;
    background-color: #bfdbfe !important;
  }
</style>
</head>
<body class="bg-green-50 p-6 font-sans flex flex-col min-h-screen">
<div class="max-w-7xl mx-auto bg-white p-6 rounded-lg shadow flex-grow">
  <h1 class="text-2xl font-bold mb-6 text-center">Llamamiento FD Bloque</h1>

  <div class="flex justify-center gap-4 mb-6">
    <button id="espanaBtn" class="border p-2 rounded shadow flex items-center gap-2 country-selected">
      <img src="https://upload.wikimedia.org/wikipedia/en/9/9a/Flag_of_Spain.svg" alt="España" class="w-6 h-4">
      España
    </button>
  </div>

  <div id="excelDrop" class="drag-drop mb-4">
    <span id="excelDropText">Arrastra y suelta tu archivo Excel aquí o haz clic para seleccionar</span>
    <input type="file" id="excelFile" accept=".xlsx, .xls" />
  </div>

  <div class="flex justify-center gap-4 mb-4 flex-wrap">
    <input type="url" id="userLink" placeholder="Inserir Forms Google" class="p-2 border rounded w-full sm:w-auto" required />
    <button id="processBtn" class="bg-green-200 text-gray-800 px-4 py-2 rounded hover:bg-green-300">Procesar</button>
  </div>

  <div class="flex justify-center gap-4 mb-4">
    <button id="toggleEmails" class="bg-green-600 text-white px-4 py-2 rounded hidden">Mostrar/Ocultar Correos</button>
    <button id="exportCSV" class="bg-yellow-600 text-white px-4 py-2 rounded hidden">Exportar excel para combinar</button>
  </div>

  <div id="resultado" class="mt-6 space-y-6"></div>
</div>

<footer class="bg-gray-700 text-white text-center py-3 mt-4">
  Área Contratación y Movimientos SH © 2025
</footer>

<script>
/* --- Estado global --- */
let allEmails = [];
let pais = 'espana';
let excelFileGlobal = null;

/* --- Elementos DOM --- */
const excelDrop = document.getElementById('excelDrop');
const excelFileInput = document.getElementById('excelFile');
const excelDropText = document.getElementById('excelDropText');

/* --- Drag & drop / file input --- */
excelDrop.addEventListener('dragover', e => { e.preventDefault(); excelDrop.classList.add('dragover'); });
excelDrop.addEventListener('dragleave', e => { excelDrop.classList.remove('dragover'); });
excelDrop.addEventListener('drop', e => {
  e.preventDefault();
  excelDrop.classList.remove('dragover');
  if (e.dataTransfer.files.length > 0) {
    excelFileInput.files = e.dataTransfer.files;
    excelFileGlobal = e.dataTransfer.files[0];
    excelDropText.textContent = `Archivo recibido: ${excelFileGlobal.name}`;
  }
});
excelFileInput.addEventListener('change', e => {
  if (excelFileInput.files.length > 0) {
    excelFileGlobal = excelFileInput.files[0];
    excelDropText.textContent = `Archivo recibido: ${excelFileGlobal.name}`;
  }
});

/* --- Utilidades --- */
function normalizeText(t){ return t?.toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase(); }
function formatDate(v){
  if(!v) return '';
  let d;
  if(v instanceof Date) d=v;
  else if(typeof v==='number'){ let c=XLSX.SSF.parse_date_code(v); d=new Date(c.y, c.m-1, c.d); }
  else d=new Date(v);
  return isNaN(d) ? v : d.toLocaleDateString('es-ES');
}

/* --- Mapeo ampliado de tipos de contrato a descripción --- */
function getContratoText(tipoRaw){
  const tipo = (tipoRaw||'').toString().trim();
  const t = tipo.toLowerCase();

  if(t.includes('tt - lunes a domingo') || t === 'tt') {
    return '40 horas semanales distribuidas de Lunes a Domingo';
  }
  if(t.includes('tt - lunes a sabado') || t.includes('lunes a sábado')) {
    return '40 horas semanales distribuidas de Lunes a Sábado';
  }
  if(t.includes('domingo a viernes')) {
    return '40 horas semanales distribuidas de Domingo a Viernes';
  }

  if(t.includes('tp30')){
    return '30 horas semanales distribuidas en Lunes, Jueves, Viernes y Domingo';
  }

  if(t.includes('tp22')){
    if(t.includes('lunes') && t.includes('viernes') && t.includes('sábado')) return '22,5 horas semanales distribuidas en Lunes, Viernes y Sábado';
    if(t.includes('lunes') && t.includes('viernes') && t.includes('domingo')) return '22,5 horas semanales distribuidas en Lunes, Viernes y Domingo';
  }

  if(t.includes('tp15')){
    if(t.includes('viernes') && t.includes('sábado')) return '15 horas semanales distribuidas en Viernes y Sábado';
    if(t.includes('viernes') && t.includes('domingo')) return '15 horas semanales distribuidas en Viernes y Domingo';
  }

  return tipo || '';
}

/* --- Gera o corpo do e-mail --- */
function generateEmail(emp, link){
  let texto = '';
  emp.periodos.forEach(p=>{
    texto += `‒ Del ${p.fechaInicio} al ${p.fechaFin} a ${p.tipoContrato}.\n`;
    if(p.turno) texto += `‒ Turno: ${p.turno}.\n`;
    texto += `‒ En el Centro de trabajo ubicado en: ${p.direccion}, ${p.poblacion}.\n`;
    texto += `‒ Tu Coordinador será ${p.coordinador}.\n\n`;
  });
  const body = `¡Hola ${emp.nome}!\n\nNos ponemos en contacto contigo para informarte sobre tu próximo periodo de actividad como trabajador Fijo Discontinuo de Mercadona.\n\nTe detallamos los datos de tu incorporación:\n\n${texto}¿Qué necesitamos saber?\nTe pedimos que completes el siguiente formulario (máximo 7 días).\n\n${link}`;
  return { to: emp.correo, subject: 'Información sobre tu próximo periodo', body };
}

/* --- EXPORTAÇÃO PARA XLSX (NOVO) --- */
function exportToXLSXMailMerge(emails){
  if(emails.length===0) return alert('Ningún email procesado.');

  const data = emails.map(e => ({
    Email: e.to,
    Subject: e.subject,
    Body: e.body
  }));

  const worksheet = XLSX.utils.json_to_sheet(data);
  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Correos");

  XLSX.writeFile(workbook, "correos.xlsx");
}

/* --- Botão Procesar --- */
document.getElementById('processBtn').onclick = () => {
  const link = document.getElementById('userLink').value.trim();
  if(!link) return alert('Por favor, introduce un vínculo válido de Forms Google antes de procesar.');
  const file = excelFileGlobal;
  if(!file) return alert('Selecciona un archivo Excel.');
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });

    const pedido = wb.Sheets['Pedido'];
    const prod = wb.Sheets['Prod NIF nombre @'];
    const zonero = wb.Sheets['Zonero'];
    if(!pedido || !prod || !zonero) return alert('Faltan hojas obligatorias.');

    const rowsP = XLSX.utils.sheet_to_json(pedido, { header:1 });
    const headers = rowsP[0] || [];
    const data = rowsP.slice(1);

    const colEmp = headers.findIndex(h => normalizeText(h).includes('empleado'));
    const colTipo = headers.findIndex(h => normalizeText(h).includes('tipo de contrato'));
    const colNombreCoordinadorPedido = headers.findIndex(h => normalizeText(h).includes('nombre coordinador'));
    const turnoCols = headers.map((h,i)=>({h,i})).filter(x=>normalizeText(x.h).startsWith('turno'));

    const filtered = data.filter(r => r[colEmp]);

    const rp = XLSX.utils.sheet_to_json(prod, { header:1 });
    const hp = rp[0] || [];
    const dp = rp.slice(1);
    const colId = hp.findIndex(h => normalizeText(h).includes('num empleado'));
    const colNome = hp.findIndex(h => normalizeText(h).includes('nombre'));
    const colMail = hp.findIndex(h => normalizeText(h).includes('correo'));
    const prodMap = {};
    dp.forEach(r => {
      const id = normalizeText(r[colId]);
      if(id) prodMap[id] = { nome: r[colNome]||'', mail: r[colMail]||'' };
    });

    const rz = XLSX.utils.sheet_to_json(zonero, { header:1 });
    const hz = rz[0] || [];
    const dz = rz.slice(1);
    const colC = hz.findIndex(h => normalizeText(h).includes('centro'));
    const colD = hz.findIndex(h => normalizeText(h).includes('direccion'));
    const colP = hz.findIndex(h => normalizeText(h).includes('poblacion'));
    const colCoZonero = hz.findIndex(h => normalizeText(h).includes('coordinador'));
    const zoneroMap = {};
    dz.forEach(r => {
      const id = normalizeText(r[colC]);
      if(id) zoneroMap[id] = { dir: r[colD]||'', pob: r[colP]||'', co: r[colCoZonero]||'' };
    });

    const fiCols = headers.map((h,i)=>({h,i})).filter(x=>normalizeText(x.h).startsWith('fecha inicio'));
    const ffCols = headers.map((h,i)=>({h,i})).filter(x=>normalizeText(x.h).startsWith('fecha fin'));
    const ceCols = headers.map((h,i)=>({h,i})).filter(x=>normalizeText(x.h).startsWith('centro'));
    const tcCols = headers.map((h,i)=>({h,i})).filter(x=>normalizeText(x.h).startsWith('tipo de contrato'));

    const combined = {};
    filtered.forEach(r => {
      const id = normalizeText(r[colEmp]);
      const info = prodMap[id] || { nome: '', mail: '' };
      if(!combined[id]) combined[id] = { emp: r[colEmp], nome: info.nome, correo: info.mail, periodos: [] };

      for(let i=0;i<fiCols.length;i++){
        const fi = formatDate(r[fiCols[i].i]);
        const ff = formatDate(r[ffCols[i].i]);
        const ce = r[ceCols[i].i] || '';
        let tc = (r[tcCols[i]?.i] || r[colTipo] || '') .toString().trim();

        let turnoVal = turnoCols[i] ? (r[turnoCols[i].i] || '').toString().trim() : '';

        const contrato = getContratoText(tc);

        let coordPedidoVal = colNombreCoordinadorPedido !== -1 ? (r[colNombreCoordinadorPedido] || '') : '';
        const z = zoneroMap[normalizeText(ce)] || { dir:'', pob:'', co:'' };
        const coordinadorFinal = coordPedidoVal.trim() !== '' ? coordPedidoVal : z.co;

        if(fi || ff) combined[id].periodos.push({
          fechaInicio: fi,
          fechaFin: ff,
          centro: ce,
          direccion: z.dir,
          poblacion: z.pob,
          coordinador: coordinadorFinal,
          tipoContrato: contrato,
          turno: turnoVal
        });
      }
    });

    let html = `<h2 class='text-xl font-bold mb-2'>Datos Combinados por Trabajador</h2>`;
    html += `<div class='overflow-x-auto'><table class='min-w-full border border-gray-300 text-sm'><thead class='bg-gray-200'><tr>`;
    ['#','Empleado','Nombre','Correo','Nº de períodos','Fecha Inicio','Fecha Fin','Tipo de contrato','Turno','Centro','Dirección','Población','Coordinador'].forEach(h=>html+=`<th class='border px-2 py-1'>${h}</th>`);
    html += `</tr></thead><tbody>`;

    allEmails = [];
    let counter = 1;
    Object.values(combined).forEach(emp=>{
      const numPeriodos = emp.periodos.length || 1;
      if(emp.periodos.length === 0) emp.periodos.push({fechaInicio:'-',fechaFin:'-',centro:'-',direccion:'-',poblacion:'-',coordinador:'-',tipoContrato:'-',turno:''});

      emp.periodos.forEach((p,i)=>{
        html += `<tr class='${i%2===0?'bg-white':'bg-gray-50'} hover:bg-gray-100'>`;
        if(i===0) html += `<td class='border px-2 py-1' rowspan='${numPeriodos}'>${counter}</td>`;
        if(i===0) html += `<td class='border px-2 py-1' rowspan='${numPeriodos}'>${emp.emp}</td>`;
        if(i===0) html += `<td class='border px-2 py-1' rowspan='${numPeriodos}'>${emp.nome}</td>`;
        if(i===0) html += `<td class='border px-2 py-1' rowspan='${numPeriodos}'>${emp.correo}</td>`;
        if(i===0) html += `<td class='border px-2 py-1' rowspan='${numPeriodos}'>${numPeriodos}</td>`;
        html += `<td class='border px-2 py-1'>${p.fechaInicio}</td>`;
        html += `<td class='border px-2 py-1'>${p.fechaFin}</td>`;
        html += `<td class='border px-2 py-1'>${p.tipoContrato}</td>`;
        html += `<td class='border px-2 py-1'>${p.turno || '-'}</td>`;
        html += `<td class='border px-2 py-1'>${p.centro}</td>`;
        html += `<td class='border px-2 py-1'>${p.direccion}</td>`;
        html += `<td class='border px-2 py-1'>${p.poblacion}</td>`;
        html += `<td class='border px-2 py-1'>${p.coordinador}</td>`;
        html += `</tr>`;
      });
      allEmails.push(generateEmail(emp, link));
      counter++;
    });
    html += `</tbody></table></div>`;

    let emailsHtml = '<div id="emailsContainer" class="hidden space-y-4 mt-6">';
    allEmails.forEach(e=>{
      emailsHtml += `<div class='p-3 border rounded bg-gray-50'><p><strong>Para:</strong> ${e.to||'<em>sin email</em>'}</p><p><strong>Asunto:</strong> ${e.subject}</p><pre class='whitespace-pre-wrap'>${e.body}</pre></div>`;
    });
    emailsHtml += '</div>';

    document.getElementById('resultado').innerHTML = html + emailsHtml;
    document.getElementById('toggleEmails').classList.remove('hidden');
    document.getElementById('exportCSV').classList.remove('hidden');

    document.getElementById('toggleEmails').onclick = () => { 
      document.getElementById('emailsContainer').classList.toggle('hidden'); 
    };

    document.getElementById('exportCSV').onclick = () => { 
      exportToXLSXMailMerge(allEmails); 
    };
  };

  reader.readAsArrayBuffer(file);
};
</script>
</body>
</html>
